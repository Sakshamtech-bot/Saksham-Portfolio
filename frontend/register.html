<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>student entry</title>
    <style>
        body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: #0b1020;
}

.register-container {
    width: 380px;
    padding: 35px;
    background: #151b2e;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    text-align: center;
}

.register-container h1 {
    color: white;
    margin-bottom: 10px;
}

.subtitle {
    color: #00bfff;
    margin-bottom: 25px;
}

.register-container input {
    width: 100%;
    box-sizing: border-box;
    padding: 13px;
    margin: 8px 0;
    border: none;
    border-radius: 7px;
    outline: none;
}

.register-container button {
    width: 100%;
    padding: 13px;
    margin-top: 15px;
    border: none;
    border-radius: 7px;
    background: #00bfff;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.register-container button:hover {
    background: #009acd;
}

.login-link {
    color: #ccc;
    margin-top: 20px;
}

.login-link a {
    color: #00bfff;
    text-decoration: none;
}
    </style>
</head>
<body>
    <div class="register-container">
	<h1>Create Your Account</h1>
    <p class="subtitle">
	Register to explore my portfolio and project</p>
	<form id="registerForm">
		<label>FIRST NAME</label>
		<input type="text" required="required" placeholder="First Name" name="firstname">
		<br>
		<label>LAST NAME</label>
		<input type="text" required="required" placeholder="Last Name" name="lastname">
		<br>
		<label>EMAIL</label>
		<input type="email" required="required" placeholder="E-Mail" name="email">
		<br>
		<label>PASSWORD</label>
		<input type="password" required="required" placeholder="Password" name="password">
		<br>
		<label>RE-ENTER PASSWORD</label>
		<input type="password" required="required" placeholder="Re-enter password " name="password2">
		<br>
		<button type="Submit">Register Now</button>
	</form>
    <p class="login-link">
        Already have an account?
        <a href="login.html">login</a>
        </p>
    </div>
	<script>
document.getElementById("registerForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    console.log("Register button clicked!");

    const formData = new FormData(this);

    const data = {
        firstName: formData.get("firstname"),
        lastName: formData.get("lastname"),
        email: formData.get("email"),
        password: formData.get("password")
    };

    console.log("Sending data:", data);

    try {
        const response = await fetch("http://localhost:3000/api/auth/register", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
        });

        const result = await response.text();

        console.log("Server response:", result);
        alert(result);

    } catch (error) {
        console.error("Fetch error:", error);
        alert("Backend se connection nahi ho raha!");
    }
});
</script>
</body>
</html>
